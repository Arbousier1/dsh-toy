name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_VERSION: 0.1.2-rc.1

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run check
      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-node-${{ matrix.node-version }}
          path: artifacts/*.tgz

  install-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm pack --pack-destination artifacts
      - name: Install the bundle into a clean DSH profile
        run: |
          package_path="$(find "$GITHUB_WORKSPACE/artifacts" -name '*.tgz' -print -quit)"
          DSH_HOME="$RUNNER_TEMP/dsh-home" npx -y "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile web add "$package_path"
          DSH_HOME="$RUNNER_TEMP/dsh-home" npx -y "@deepseek-ai/dsh@$DSH_VERSION" --profile web --dump-config | grep -q 'id: dsh-toy'
      - name: Boot DSH with the installed bundle
        run: |
          status=0
          timeout --signal=INT --kill-after=5s 45s env DSH_HOME="$RUNNER_TEMP/dsh-home" npx -y "@deepseek-ai/dsh@$DSH_VERSION" web --no-open --port 0 > "$RUNNER_TEMP/dsh-web.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/dsh-web.log"
          test "$status" -eq 124
          grep -q 'dsh web: http://' "$RUNNER_TEMP/dsh-web.log"
